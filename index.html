<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій односторінковий сайт</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      font-size: 40px;
    }

    p {
      font-size: 20px;
      max-width: 600px;
      margin: 20px auto;
    }

    .btn {
      display: inline-block;
      padding: 15px 30px;
      background: white;
      color: #2a5298;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      margin-top: 20px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ddd;
    }
  </style>
</head>
<body>

  <h1>Ласкаво просимо 🚀</h1>
  <p>Це моя окрема односторінкова сторінка. Тут можна розмістити будь-яку інформацію, кнопку або форму.</p>

  <a href="#" class="btn">Дізнатись більше</a>

</body>
</html>
