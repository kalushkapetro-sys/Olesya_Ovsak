<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Олесі ❤️</title>

<!-- Красиві шрифти -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to top, #1e3c72, #ff758c, #ffd3a5);
    background-size: 100% 200%;
    animation: sunrise 10s ease forwards;
}

/* 🌅 Світанок */
@keyframes sunrise {
    0% { background-position: 0% 100%; }
    100% { background-position: 0% 0%; }
}

/* ✉️ Сцена */
.scene {
    position: relative;
    width: 90vw;
    max-width: 420px;
    text-align: center;
}

/* ✉️ Реалістичний конверт */
.envelope {
    position: relative;
    width: 100%;
    aspect-ratio: 16/10;
    background: linear-gradient(145deg, #ffffff, #f0f0f0);
    border-radius: 8px;
    box-shadow: 
        0 20px 50px rgba(0,0,0,0.3),
        inset 0 -5px 15px rgba(0,0,0,0.05);
    transform: translateY(-150vh);
    animation: flyIn 2s ease forwards;
    cursor: pointer;
}

/* задній трикутник */
.envelope::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 50%;
    background: #eaeaea;
    clip-path: polygon(0 100%, 50% 40%, 100% 100%);
}

/* кришка */
.flap {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(145deg, #ffffff, #e6e6e6);
    clip-path: polygon(0 0, 100% 0, 50% 60%);
    transform-origin: top;
    transition: transform 1.5s ease;
    box-shadow: inset 0 5px 15px rgba(0,0,0,0.05);
}

/* Анімація прильоту */
@keyframes flyIn {
    0% { transform: translateY(-150vh) rotate(-8deg); }
    70% { transform: translateY(15px) rotate(3deg); }
    100% { transform: translateY(0) rotate(0deg); }
}

/* текст на конверті */
.envelope-text {
    position: absolute;
    width: 100%;
    top: 40%;
    font-size: clamp(14px, 3vw, 18px);
    font-weight: 500;
    color: #e91e63;
    padding: 0 10px;
}

/* підказка */
.hint {
    margin-top: 15px;
    font-size: 14px;
    color: white;
    opacity: 0;
    animation: blink 2s infinite 2s;
}

@keyframes blink {
    0%,100% { opacity: 0; }
    50% { opacity: 1; }
}

/* 💌 Валентинка */
.card {
    position: absolute;
    width: 90vw;
    max-width: 600px;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    transform: scale(0);
    transition: transform 1.5s ease;
    text-align: center;
}

.card img {
    width: 100%;
    border-radius: 15px;
    margin-bottom: 15px;
}

/* красивий романтичний шрифт */
.message {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(22px, 4vw, 30px);
    color: #e91e63;
    line-height: 1.5;
    text-align: center;
}

/* ❤️ Сердечка */
.heart {
    position: absolute;
    font-size: 18px;
    animation: float 6s linear infinite;
    color: #fff;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="scene">

<div class="envelope" onclick="openCard()">
    <div class="flap" id="flap"></div>
    <div class="envelope-text">
        Вітаннячка з днем всіх закоханих для Олесі з України 💌
    </div>
</div>

<div class="hint">Натисни на конверт щоб відкрити 💖</div>

</div>

<div class="card" id="card">
    <img src="photo.jpg" alt="Наше фото">
    <div class="message">
Вітаю тебе красуння з днем Святого Валентина.  
Дуже сильно кохаю тебе і скучаю за тобою.  
Надію скоро вже прийдуть ті часи коли всі теплі вечори  
і спокійні світанки ми будемо зустрічати разом ❤️
    </div>
</div>

<audio id="music" src="music.mp3"></audio>

<script>
function openCard() {
    document.getElementById("flap").style.transform = "rotateX(-180deg)";
    setTimeout(() => {
        document.querySelector(".scene").style.display = "none";
        document.getElementById("card").style.transform = "scale(1)";
        document.getElementById("music").play();
        startHearts();
    }, 1500);
}

function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 15 + "px";
        heart.style.animationDuration = Math.random() * 3 + 3 + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }, 400);
}
</script>

</body>
</html>
