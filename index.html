<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Олесі 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Poppins', sans-serif;
  background:linear-gradient(to top,#0c1b3a,#ff6b8a,#ffd7a8);
  background-size:100% 200%;
  animation:sky 10s ease forwards;
}

@keyframes sky{
  0%{background-position:0% 100%;}
  100%{background-position:0% 0%;}
}

/* Сонце */
.sun{
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  background:radial-gradient(circle,#fff7cc,#ffd36b 40%,#ffb74d);
  left:10%;
  bottom:-20%;
  animation:sunrise 10s ease forwards;
}
@keyframes sunrise{
  0%{transform:translateY(0);opacity:0;}
  100%{transform:translateY(-95vh);opacity:0.9;}
}

/* Контейнер */
.wrap{
  width:min(90vw,520px);
  text-align:center;
}

/* Конверт */
.envelope{
  position:relative;
  width:100%;
  height:260px;
  background:white;
  border-radius:14px;
  box-shadow:0 25px 60px rgba(0,0,0,0.4);
  cursor:pointer;
  transform:translateY(-150vh) rotate(-7deg);
  animation:fly 2s ease forwards;
  overflow:hidden;
}
@keyframes fly{
  0%{transform:translateY(-150vh) rotate(-7deg);}
  100%{transform:translateY(0) rotate(0);}
}

/* Трикутники */
.envelope::before,
.envelope::after{
  content:"";
  position:absolute;
  bottom:0;
  width:50%;
  height:100%;
  background:#f2f2f2;
}
.envelope::before{
  left:0;
  clip-path:polygon(0 100%,100% 58%,0 0);
}
.envelope::after{
  right:0;
  clip-path:polygon(100% 100%,0 58%,100% 0);
}

/* Кришка */
.flap{
  position:absolute;
  width:100%;
  height:130px;
  background:#fafafa;
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;
  transition:transform 1.3s ease;
}

/* Текст */
.envText{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 20px;
  color:#e91e63;
  font-weight:700;
  text-align:center;
}

.hint{
  margin-top:15px;
  font-size:14px;
  color:white;
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%,100%{opacity:0.4;}
  50%{opacity:1;}
}

/* Валентинка */
.card{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.cardInner{
  width:min(92vw,680px);
  background:white;
  border-radius:22px;
  box-shadow:0 30px 70px rgba(0,0,0,0.5);
  padding:20px;
  transform:scale(0);
  transition:transform 1.2s ease;
  text-align:center;
}

.photo{
  width:100%;
  max-height:50vh;
  object-fit:cover;
  border-radius:18px;
}

.msg{
  margin-top:15px;
  font-family:'Great Vibes',cursive;
  font-size:clamp(26px,4vw,34px);
  color:#e91e63;
  line-height:1.4;
  text-align:center;
}

/* Сердечка */
.heart{
  position:absolute;
  font-size:18px;
  animation:float 6s linear infinite;
  color:white;
}
@keyframes float{
  0%{transform:translateY(110vh);opacity:0;}
  20%{opacity:1;}
  100%{transform:translateY(-12vh);opacity:0;}
}
</style>
</head>

<body>

<div class="sun"></div>

<div class="wrap">
  <div class="envelope" id="envelope">
    <div class="flap" id="flap"></div>
    <div class="envText">
      Вітаннячка з днем всіх закоханих для Олесі з України 💌
    </div>
  </div>
  <div class="hint">Натисни на конверт 💖</div>
</div>

<div class="card">
  <div class="cardInner" id="cardInner">
    <img class="photo" src="photo.jpg" alt="Наше фото">
    <div class="msg">
      Вітаю тебе красуння з днем Святого Валентина.<br>
      Дуже сильно кохаю тебе і скучаю за тобою.<br>
      Надію скоро вже прийдуть ті часи коли всі теплі вечори<br>
      і спокійні світанки ми будемо зустрічати разом ❤️
    </div>
  </div>
</div>

<audio id="music" src="music.mp3"></audio>

<script>
const envelope = document.getElementById("envelope");
const flap = document.getElementById("flap");
const cardInner = document.getElementById("cardInner");
const music = document.getElementById("music");

let opened=false;

function startHearts(){
  setInterval(()=>{
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(Math.random()*18+14)+"px";
    h.style.animationDuration=(Math.random()*3+3)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
  },400);
}

envelope.addEventListener("click",()=>{
  if(opened) return;
  opened=true;

  flap.style.transform="rotateX(-180deg)";
  setTimeout(()=>{
    envelope.style.display="none";
    cardInner.style.transform="scale(1)";
    music.play().catch(()=>{});
    startHearts();
  },1000);
});
</script>

</body>
</html>
