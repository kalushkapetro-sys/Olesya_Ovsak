<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Олесі ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to top, #2c3e50 0%, #ff758c 40%, #ffd3a5 100%);
    background-size: 100% 200%;
    animation: sunrise 8s ease forwards;
}

/* Анімація світанку */
@keyframes sunrise {
    0% { background-position: 0% 100%; }
    100% { background-position: 0% 0%; }
}

/* Конверт */
.envelope {
    position: relative;
    width: 320px;
    height: 200px;
    background: white;
    cursor: pointer;
    perspective: 1000px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

.flap {
    position: absolute;
    width: 100%;
    height: 100%;
    background: white;
    transform-origin: top;
    transition: transform 1.5s ease;
    clip-path: polygon(0 0, 100% 0, 50% 60%);
}

.envelope-text {
    position: absolute;
    width: 100%;
    text-align: center;
    top: 80px;
    font-weight: bold;
    color: #e91e63;
    padding: 0 10px;
}

/* Валентинка */
.card {
    position: absolute;
    width: 90%;
    max-width: 600px;
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    transform: scale(0);
    transition: transform 1.5s ease;
}

.card img {
    width: 100%;
    border-radius: 15px;
    margin-bottom: 20px;
}

.message {
    font-size: 20px;
    color: #e91e63;
    line-height: 1.6;
}

/* Сердечка */
.heart {
    position: absolute;
    font-size: 20px;
    animation: float 6s linear infinite;
    color: #fff;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="envelope" onclick="openCard()">
    <div class="flap" id="flap"></div>
    <div class="envelope-text">
        Вітаннячка з днем всіх закоханих для Олесі з України 💌
    </div>
</div>

<div class="card" id="card">
    <img src="photo.jpg" alt="Наше фото">
    <div class="message">
Вітаю тебе красуння з днем Святого Валентина. 
Дуже сильно кохаю тебе і скучаю за тобою. 
Надію скоро вже прийдуть ті часи коли всі теплі вечори 
і спокійні світанки ми будемо зустрічати разом ❤️
    </div>
</div>

<audio id="music" src="music.mp3"></audio>

<script>
function openCard() {
    document.getElementById("flap").style.transform = "rotateX(-180deg)";
    setTimeout(() => {
        document.querySelector(".envelope").style.display = "none";
        document.getElementById("card").style.transform = "scale(1)";
        document.getElementById("music").play();
        startHearts();
    }, 1500);
}

function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 15 + "px";
        heart.style.animationDuration = Math.random() * 3 + 3 + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }, 400);
}
</script>

</body>
</html>
