<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Для Олесі 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --pink:#e91e63;
    --paper:#ffffff;
    --paper2:#f1f1f1;
    --shadow: rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Poppins', sans-serif;
    background: linear-gradient(to top, #0c1b3a 0%, #ff6b8a 45%, #ffd7a8 100%);
    background-size: 100% 200%;
    animation: sky 10s ease forwards;
    position:relative;
  }
  @keyframes sky{
    0%{ background-position:0% 100%; }
    100%{ background-position:0% 0%; }
  }

  /* Сонце */
  .sun{
    position:absolute;
    width: clamp(90px, 14vw, 140px);
    height: clamp(90px, 14vw, 140px);
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #fff7cc, #ffd36b 40%, #ffb74d 70%);
    box-shadow: 0 0 40px rgba(255,220,120,0.55);
    left: 12%;
    bottom: -22%;
    animation: sun 10s ease forwards;
    pointer-events:none;
  }
  @keyframes sun{
    0%{ transform: translateY(0); opacity:0; }
    20%{ opacity:.6; }
    100%{ transform: translateY(-95vh); opacity:.9; }
  }

  .wrap{
    width: min(92vw, 520px);
    text-align:center;
    position:relative;
    z-index:2;
  }

  .hint{
    margin-top:14px;
    font-size:14px;
    color: rgba(255,255,255,0.92);
    animation: pulse 2s ease-in-out infinite;
    user-select:none;
  }
  @keyframes pulse{
    0%,100%{ opacity:.35; transform: translateY(0); }
    50%{ opacity:1; transform: translateY(-2px); }
  }

  /* ✉️ Конверт */
  .envelope{
    position:relative;
    width:100%;
    height: 270px;
    border-radius: 16px;
    background: linear-gradient(145deg, var(--paper), #f7f7f7);
    box-shadow: 0 22px 55px var(--shadow), inset 0 -10px 18px rgba(0,0,0,0.06);
    overflow:hidden;
    cursor:pointer;

    transform: translateY(-150vh) rotate(-7deg);
    animation: fly 2s cubic-bezier(.2,.9,.2,1.1) forwards;

    /* 3D для кришки */
    perspective: 900px;
  }

  @keyframes fly{
    0%{ transform: translateY(-150vh) rotate(-7deg); }
    70%{ transform: translateY(18px) rotate(2deg); }
    85%{ transform: translateY(-8px) rotate(-1deg); }
    100%{ transform: translateY(0) rotate(0deg); }
  }

  /* нижні трикутники — НЕ блокують клік */
  .envelope::before,
  .envelope::after{
    content:"";
    position:absolute;
    bottom:0;
    width:50%;
    height:100%;
    background: linear-gradient(145deg, var(--paper2), #e6e6e6);
    pointer-events:none;
    z-index:1;
    opacity: .95;
  }
  .envelope::before{
    left:0;
    clip-path: polygon(0 100%, 100% 58%, 0 0);
  }
  .envelope::after{
    right:0;
    clip-path: polygon(100% 100%, 0 58%, 100% 0);
  }

  /* кришка */
  .flap{
    position:absolute;
    top:0; left:0;
    width:100%;
    height: 140px;
    background: linear-gradient(145deg, #ffffff, #e9e9e9);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    transition: transform 1.25s cubic-bezier(.2,.9,.2,1);
    box-shadow: 0 8px 18px rgba(0,0,0,0.08);
    backface-visibility: hidden;
    z-index:4;
    pointer-events:none; /* щоб клік проходив на envelope */
  }

  /* накладка-складки */
  .crease{
    position:absolute;
    inset:0;
    background:
      linear-gradient(135deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 35%),
      linear-gradient(225deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 35%);
    opacity:.28;
    pointer-events:none;
    z-index:2;
  }

  /* текст — поверх всього */
  .envText{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 0 18px;
    text-align:center;
    color: var(--pink);
    font-weight:700;
    font-size: clamp(14px, 2.6vw, 18px);
    z-index:3;
    pointer-events:none;
  }

  /* печатка-серце */
  .seal{
    position:absolute;
    left:50%;
    top: 60%;
    transform: translate(-50%, -50%);
    width: 54px;
    height: 54px;
    border-radius: 16px;
    background: radial-gradient(circle at 30% 30%, #ffd1dc, #ff4b7f);
    box-shadow: 0 10px 20px rgba(233,30,99,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
    pointer-events:none;
  }
  .seal span{ font-size:22px; }

  /* стан відкриття */
  .opened .flap{ transform: rotateX(-180deg); }
  .opened .seal{ opacity: 0; transform: translate(-50%, -50%) scale(0.85); transition: all .4s ease; }

  /* Валентинка */
  .card{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 18px;
    z-index:3;
    pointer-events:none;
  }
  .cardInner{
    width: min(92vw, 680px);
    background: rgba(255,255,255,0.98);
    border-radius: 22px;
    box-shadow: 0 28px 70px rgba(0,0,0,0.45);
    padding: 18px;
    transform: scale(0);
    transition: transform 1.1s cubic-bezier(.2,.9,.2,1);
    text-align:center;
    pointer-events:auto;
  }

  .photo{
    width:100%;
    max-height: 50vh;
    object-fit: cover;
    border-radius: 18px;
    display:block;
  }

  .msg{
    margin-top: 14px;
    font-family: 'Great Vibes', cursive;
    color: var(--pink);
    font-size: clamp(26px, 4.5vw, 36px);
    line-height: 1.35;
    text-align:center;
  }

  /* ❤️ сердечка */
  .heart{
    position:absolute;
    font-size:18px;
    animation: float 6s linear infinite;
    color:white;
    pointer-events:none;
    z-index:1;
  }
  @keyframes float{
    0%{ transform: translateY(110vh); opacity:0; }
    20%{ opacity:1; }
    100%{ transform: translateY(-12vh); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    body, .sun, .envelope { animation: none !important; transform: none !important; }
    .flap, .cardInner { transition: none !important; }
    .hint{ animation:none; opacity:1; }
  }
</style>
</head>

<body>
  <div class="sun"></div>

  <div class="wrap">
    <div class="envelope" id="envelope">
      <div class="flap" id="flap"></div>
      <div class="crease"></div>
      <div class="envText">Вітаннячка з днем всіх закоханих для Олесі з України 💌</div>
      <div class="seal"><span>❤️</span></div>
    </div>
    <div class="hint">Натисни на конверт 💖</div>
  </div>

  <div class="card">
    <div class="cardInner" id="cardInner">
      <img class="photo" src="photo.jpg" alt="Наше фото">
      <div class="msg">
        Вітаю тебе красуння з днем Святого Валентина.<br>
        Дуже сильно кохаю тебе і скучаю за тобою.<br>
        Надію скоро вже прийдуть ті часи коли всі теплі вечори<br>
        і спокійні світанки ми будемо зустрічати разом ❤️
      </div>
    </div>
  </div>

  <audio id="music" src="music.mp3" preload="auto"></audio>

<script>
  const envelope = document.getElementById("envelope");
  const cardInner = document.getElementById("cardInner");
  const music = document.getElementById("music");

  let opened = false;

  function startHearts(){
    setInterval(() => {
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = "❤️";
      h.style.left = (Math.random() * 100) + "vw";
      h.style.fontSize = (Math.random() * 18 + 14) + "px";
      h.style.animationDuration = (Math.random() * 3 + 3) + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 6500);
    }, 380);
  }

  envelope.addEventListener("click", () => {
    if (opened) return;
    opened = true;

    envelope.classList.add("opened");

    setTimeout(() => {
      envelope.style.display = "none";
      cardInner.style.transform = "scale(1)";
      music.play().catch(()=>{});
      startHearts();
    }, 1050);
  });
</script>
</body>
</html>
